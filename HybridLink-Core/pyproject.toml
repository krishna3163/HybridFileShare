[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridlink-core"
version = "0.1.0"
description = "Cross-platform PC transfer engine for USB and WiFi multipath transfers"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "HybridLink Team"}]
keywords = ["transfer", "usb", "wifi", "multipath", "adb"]

dependencies = [
    "paramiko>=3.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "pylint>=2.17.0",
    "mypy>=1.0.0",
]

[project.scripts]
hybridlink = "hybridlink_core.cli:main"

[tool.setuptools]
packages = ["hybridlink_core"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
