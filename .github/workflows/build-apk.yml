name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x ./app/gradlew
      working-directory: ./app
    
    - name: Build APK (debug)
      run: ./gradlew assembleDebug
      working-directory: ./app
    
    - name: Build APK (release)
      run: ./gradlew assembleRelease
      working-directory: ./app
    
    - name: Upload debug APK
      uses: actions/upload-artifact@v3
      with:
        name: hybridlink-debug.apk
        path: app/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload release APK
      uses: actions/upload-artifact@v3
      with:
        name: hybridlink-release.apk
        path: app/app/build/outputs/apk/release/app-release.apk
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/app/build/outputs/apk/debug/app-debug.apk
          app/app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notify on success
      if: success()
      run: echo "✅ APK build successful!"
    
    - name: Notify on failure
      if: failure()
      run: echo "❌ APK build failed!"
