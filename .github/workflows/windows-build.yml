name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install
        working-directory: windows-client

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: windows-client
          tagName: v__VERSION__
          releaseName: "HybridLink Windows v__VERSION__"
          releaseBody: "Automated build of the HybridLink Windows Client."
          releaseDraft: true
          prerelease: false

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: windows-client/src-tauri/target/release/bundle/msi/*.msi
